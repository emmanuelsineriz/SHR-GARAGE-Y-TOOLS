name: Actualizar catálogo de elgasolero.com

on:
  schedule:
    - cron: '17 8 * * *'      # todos los días 05:17 hora Argentina
  workflow_dispatch:           # botón "Run workflow" para probarlo a mano

permissions:
  contents: write
  pages: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4 lxml

      - name: Bajar catálogo con precios
        id: bajar
        env:
          ELGASOLERO_CLAVE: ${{ secrets.ELGASOLERO_CLAVE }}
        run: python3 tools/sync_catalogo.py catalogo.json estado.json

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name  "catalogo-bot"
          git config user.email "catalogo-bot@users.noreply.github.com"
          git add catalogo.json estado.json
          if git diff --cached --quiet; then
            echo "Nada para guardar."
          else
            git commit -m "Catálogo: actualización automática $(date -u +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "CAMBIO=1" >> "$GITHUB_ENV"
          fi

      - name: Publicar la página
        if: always() && env.CAMBIO == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages se publica solo"
