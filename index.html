<title>SHR Garage &amp; Tools · Ventas</title>
<style>
:root{--bg:#1b1b1d;--panel:#262628;--panel2:#2f2f32;--line:#3d3d41;--tx:#f2f1ec;--mut:#9a9a9f;--yel:#ffc400;--yel2:#e0a800;--ok:#3ecf8e;--bad:#ff5d5d;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
:root{--hh:68px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--yel);padding:6px 14px;min-height:var(--hh);display:flex;align-items:center;gap:12px}
header .logo{height:52px;width:auto;border-radius:8px;display:block;flex:none}
header h1{font-size:16px;margin:0;letter-spacing:.06em;text-transform:uppercase;flex:1}
header h1 span{color:var(--yel)}
.ver{font-size:11px;color:var(--mut)}
.wa{flex:none;display:flex;align-items:center;gap:6px;background:#25d366;color:#06361a;font-weight:800;font-size:13px;text-decoration:none;padding:9px 12px;border-radius:999px;min-height:40px}
.wa svg{width:20px;height:20px;fill:#06361a}
@media(max-width:430px){.wa span{display:none}.wa{padding:0;width:44px;height:44px;justify-content:center}.wa svg{width:26px;height:26px}}
main{padding:12px;max-width:900px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#121214;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 4px 9px;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.05em;position:relative}
nav button b{display:block;font-size:19px;margin-bottom:1px}
nav button.on{color:var(--yel)}
nav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--yel)}
input,select,textarea{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yel);border-color:var(--yel)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
button.btn{background:var(--yel);color:#1b1b1d;border:0;border-radius:var(--r);padding:11px 16px;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
button.btn.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
button.btn.bad{background:var(--bad);color:#fff}
button.btn.sm{padding:6px 10px;font-size:12px}
button.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:8px 0}
.prod{display:flex;gap:10px;align-items:center}
.prod .info{flex:1;min-width:0}
.prod .nm{font-weight:600;overflow-wrap:anywhere}
.prod .meta{font-size:12px;color:var(--mut);margin-top:2px}
.prod .pr{font-weight:800;color:var(--yel);white-space:nowrap;font-size:16px}
.prod img{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#111}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);margin-left:4px;text-transform:uppercase}
.tag.low{color:var(--bad);border-color:var(--bad)}

.modal{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:flex-end;justify-content:center}

.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:12px 0}
.tot span:last-child{color:var(--yel)}
.q{display:flex;align-items:center;gap:4px}

.q input{width:56px;text-align:center;padding:7px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px}

button,.card,.gc,.chip,.kpi{transition:transform .12s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}
button:active:not(:disabled),.card[onclick]:active,.gc:active{transform:scale(.96)}
@media(hover:hover){.gc:hover{transform:translateY(-3px);border-color:var(--yel);box-shadow:0 8px 20px #0008}.card[onclick]:hover{border-color:var(--yel)}.chip:hover{border-color:var(--yel)}button.btn:hover:not(:disabled){filter:brightness(1.1)}}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main.enter .gc,main.enter .card,main.enter .kpi{animation:fup .35s ease both}
main.enter .gc:nth-child(2),main.enter .card:nth-child(2){animation-delay:.04s}main.enter .gc:nth-child(3),main.enter .card:nth-child(3){animation-delay:.08s}main.enter .gc:nth-child(4),main.enter .card:nth-child(4){animation-delay:.12s}main.enter .gc:nth-child(n+5),main.enter .card:nth-child(n+5){animation-delay:.16s}

.pop{animation:pop .35s ease}

.cartbar.bump{animation:bump .35s ease}
.badge.pop{animation:pop .35s ease}

.modal{animation:fi .2s ease}.modal>div{animation:sl .28s cubic-bezier(.2,.8,.2,1)}

function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const subtleOk=()=>{try{return !!(window.crypto&&crypto.subtle&&crypto.subtle.digest)}catch(e){return false}};
function randHex(n){const a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function hashPw(pw,salt,alg,iter){
  if(alg==='P'){
    const te=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(salt),iterations:iter||210000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  const txt=salt+'|'+pw;
  if(alg==='S'){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
  return cyrb53(txt)+cyrb53(txt,7);
}
async function makeHash(pw){const alg=subtleOk()?'S':'C',salt=randHex(8);return {alg,salt,hash:await hashPw(pw,salt,alg)}}
async function verifyHash(pw,o){if(!o)return false;try{return (await hashPw(pw,o.salt,o.alg,o.iter))===o.hash}catch(e){return false}}
function newRecCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint8Array(8);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);let c='';a.forEach(b=>c+=A[b%A.length]);return c}

    let ok=true,sc=0;const nm=norm(nombre(p));

    out.push({p,s:sc});

  out.sort((a,b)=>b.s-a.s||COL.compare(nombre(a.p),nombre(b.p)));

/* WA-MATCH-START */
const WA_STOP=new Set(['c','p','de','con','para','x','en','a','y','el','la','un','una','los','las','por','del','al']);
const WA_UNIT={gms:'gr',gm:'gr',grs:'gr',gramos:'gr',mt:'mts',m:'mts',metros:'mts',metro:'mts',cms:'cm'};
function waTok(str){
  let t=norm(str);
  t=t.replace(/\bductape\b|\bduct tape\b|\bducktape\b/g,'duc tape').replace(/\bportalamparas?\b/g,'porta lampara').replace(/\bbuscapolos\b/g,'buscapolo').replace(/\bcermico\b/g,'ceramico');
  if(/\bbici/.test(t))t=t.replace(/\blibras?\b/g,'linga');
  t=t.replace(/(\d)[.,](\d)/g,'$1\u0001$2').replace(/(\d)\s*x\s*(\d)/g,'$1 $2').replace(/(\d)([a-z])/g,'$1 $2').replace(/([a-z])(\d)/g,'$1 $2').replace(/[^a-z0-9\u0001]+/g,' ').trim();   /* los decimales (1.5) quedan juntos */
  return t.split(' ').filter(w=>w&&!WA_STOP.has(w)).map(w=>{if(w.length>4&&w.endsWith('s'))w=w.slice(0,-1);return WA_UNIT[w]||w});
}
function waPT(p){return p._wt||(p._wt=waTok(p.n+' '+(p.r||'')))}
function waScore(t,pt){let b=0;for(const w of pt){if(w===t)return 3;if(/[a-z]/.test(t)&&t.length>=2&&w.startsWith(t))b=Math.max(b,2)}return b}
/* devuelve {sel, cands, quitadas} para una lista de palabras */
function waMatch(T){
  const rows=[];
  for(const p of INDEX){if(getOv(p.c).oculto)continue;const pt=waPT(p);const m=T.map(t=>waScore(t,pt));if(m.some(x=>x>0))rows.push({p,m,pt})}
  const hit=T.map((t,i)=>rows.some(r=>r.m[i]>0));
  const U=T.map((_,i)=>i).filter(i=>hit[i]),quitadas=T.filter((_,i)=>!hit[i]);
  if(!U.length)return{sel:null,cands:[],quitadas};
  const rank=r=>({r,n:U.filter(i=>r.m[i]>0).length,sc:U.reduce((a,i)=>a+r.m[i],0)-r.pt.length*.05});
  let L=rows.map(rank);
  const full=L.filter(x=>x.n===U.length).sort((a,b)=>b.sc-a.sc);
  if(full.length){
    const c=full.slice(0,8).map(x=>x.r.p);
    return{sel:(full.length===1&&!quitadas.length)?c[0]:null,cands:c,quitadas,flojo:quitadas.length>U.length};
  }
  /* sin coincidencia total: ranking por palabras, las más específicas (poco frecuentes) pesan más */
  const cnt=U.map(i=>rows.filter(r=>r.m[i]>0).length),wt=cnt.map(c=>Math.log(1+rows.length/c)),tot=wt.reduce((x,y)=>x+y,0);
  const ws=r=>U.reduce((a,i,k)=>a+(r.m[i]>0?wt[k]*(r.m[i]===3?1:.8):0),0)-r.pt.length*.02;
  const par=rows.map(r=>({p:r.p,w:ws(r)})).sort((a,b)=>b.w-a.w);
  const top=par[0]?par[0].w:0;
  const par2=top>=tot*.25?par.filter(x=>x.w>=top*.6).slice(0,8).map(x=>x.p):[];
  const flojo=top<tot*.7||quitadas.length>U.length;
  return{sel:null,cands:par2,quitadas,flojo};
}
/* WA-MATCH-END */

/* foto -> texto (lector OCR dentro del navegador, sin enviar nada a ningún servidor) */
function cargarScript(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('sin conexión para cargar el lector'));document.head.appendChild(e)})}
async function waFoto(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const st=$('#waFotoSt'),set=t=>{const e=$('#waFotoSt');if(e)e.textContent=t};
  try{
    set('Preparando la foto…');
    const bmp=await createImageBitmap(f),sc=Math.min(2.5,Math.max(.4,1800/bmp.width));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,cv.width,cv.height);
    const im=cx.getImageData(0,0,cv.width,cv.height),d=im.data;           /* gris + más contraste */
    for(let i=0;i<d.length;i+=4){let g=.3*d[i]+.59*d[i+1]+.11*d[i+2];g=(g-128)*1.35+128;g=g<0?0:g>255?255:g;d[i]=d[i+1]=d[i+2]=g}
    cx.putImageData(im,0,0);
    if(!window.Tesseract){set('Cargando el lector (la primera vez tarda un poco)…');await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
    const w=await Tesseract.createWorker('spa',1,{logger:m=>{if(m.status==='recognizing text')set('Leyendo la foto… '+Math.round(m.progress*100)+'%');else if(m.status)set('Preparando el lector…')}});
    const r=await w.recognize(cv);await w.terminate();
    const txt=String(r.data.text||'').split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!/^\d{1,2}:\d{2}(\s*[ap]\.?\s?m\.?)?$/i.test(x)).map(x=>x.replace(/^[Il|](?=\s)/,'1')).join('\n');
    const ta=$('#waTxt');if(ta)ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+txt;
    set(txt?'Listo. Revisá el texto de arriba, corregí lo que haga falta y tocá "Analizar pedido".':'No pude leer texto en la foto. Probá con otra más cerca y derecha.');
  }catch(e){set('No pude leer la foto ('+((e&&e.message)||e)+'). Probá con otra, o escribí el pedido.')}
}
function waAnalizar(){
  S.pick=S.pick||{};
  WA.raw=($('#waTxt')||{}).value||'';WA.lines=[];WA.ign=[];
  const SALUDO=/^(hola|buen[oa]s?|gracias|saludos|te paso|pedido|por favor|quer[ií]a|necesito|disculp|ok\b|dale)/i;
  WA.raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{
    let q=1,txt=line,sinq=true,porCod=null;
    const mc=line.match(/^(\d{4,6})\b\s*(?:[xX]\s*(\d+))?\s*$/);                 /* solo un código: "13405" o "13405 x 3" */
    const mq=line.match(/^(\d+)\s*(?:x|u\.?|un\.?|unid\w*|[.)-])?\s+(.+)$/i);   /* cantidad + producto */
    if(mc&&find(mc[1])){porCod=find(mc[1]);q=Math.max(1,parseInt(mc[2],10)||1);sinq=!mc[2];txt=line}
    else if(mq){q=Math.max(1,parseInt(mq[1],10)||1);txt=mq[2];sinq=false}
    txt=txt.replace(/[.\s]+$/,'');
    const T=waTok(txt);
    if(!porCod&&(!T.length||txt.length<3||(sinq&&SALUDO.test(txt)))){WA.ign.push(line);return}
    const key=T.join(' ');
    const learned=!porCod&&S.pick[key]&&find(S.pick[key]);
    const r=porCod?{sel:porCod,cands:[porCod],quitadas:[]}:learned?{sel:learned,cands:[learned],quitadas:[]}:waMatch(T);

function csvDe(items,extra){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const d=v=>String(v==null?'':v).replace('.',',');
  const L=['Código;Producto;Cantidad;Precio unitario;Subtotal'];
  let tot=0;(items||[]).forEach(i=>{const sub=(i.q||0)*(i.p||0);tot+=sub;L.push([q(i.c),q(i.n),d(i.q),d(i.p),d(sub)].join(';'))});
  L.push(['','"TOTAL"','','',d(tot)].join(';'));
  return '\ufeff'+(extra?extra+'\r\n':'')+L.join('\r\n');
}
function bajarCsv(nombre,items,extra){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvDe(items,extra)],{type:'text/csv;charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove()}

  UNSUB.push(X.watch('config/app',d=>{if(d)applyCloud(d);cfgReady=true;render()},cfgFail));
  UNSUB.push(X.watch('users/'+uid,d=>{if(!d||d.activo===false){authErr='Tu cuenta no está disponible. Consultá por WhatsApp.';X.signOut();return}const m=CLIENT.margen;CLIENT={uid,...d};if(m!==d.margen)render()},()=>{}));
  UNSUB.push(X.watchColl('ventas','uid',uid,l=>{VENTAS_C=l.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));if(tab==='mis'&&!$('#modalHost').innerHTML)render()},()=>{}));
  setTimeout(()=>{if(!cfgReady&&ROLE==='cliente'){cfgReady=true;render()}},4000);
}
/* configuración compartida: margen, redondeo, margen por rubro, datos del negocio, productos editados */
function cloudSub(){return JSON.parse(JSON.stringify({margen:S.cfg.margen,margenCliente:S.cfg.margenCliente,redondeo:S.cfg.redondeo,margenRubro:S.cfg.margenRubro||{},nombre:S.cfg.nombre,tel:S.cfg.tel,pie:S.cfg.pie,ov:S.ov||{},custom:S.custom||[],pick:S.pick||{}}))}
function applyCloud(d){
  SUPPRESS=true;
  ['margen','margenCliente','redondeo','nombre','tel','pie'].forEach(k=>{if(d[k]!==undefined)S.cfg[k]=d[k]});
  S.cfg.margenRubro=d.margenRubro||{};S.ov=d.ov||{};S.custom=d.custom||[];if(ROLE==='admin')S.pick=d.pick||S.pick||{};
  lastSer=stable(cloudSub());buildIndex();save();SUPPRESS=false;
  if(!$('#modalHost').innerHTML&&!(ROLE==='admin'&&tab==='config'))render();
}
function schedulePush(){if(ROLE!=='admin'||!cfgReady||SUPPRESS||!X)return;clearTimeout(pushT);pushT=setTimeout(()=>pushNow(false),700)}
function pushNow(force){
  if(ROLE!=='admin'||!X)return;
  const sub=cloudSub(),ser=stable(sub);if(!force&&ser===lastSer)return;
  lastSer=ser;myUpd=new Date().toISOString()+Math.random().toString(36).slice(2,6);
  X.set('config/app',{...sub,upd:myUpd,v:APP_VERSION}).catch(e=>{lastSer='';toast('No pude sincronizar con la nube')});
}

function busy(b){const g=$('#aGo');if(g){g.disabled=b;g.textContent=b?'Un momento…':(authMode_==='reg'?'Crear mi cuenta':'Ingresar')}}
async function doLogin(){
  if(authBusy||!X)return;const u=slug($('#aU').value),p=$('#aP').value;
  if(!u||!p){setErr('Completá usuario y contraseña');return}
  authBusy=true;busy(true);setErr('');
  try{await X.signIn(u+EMAIL_DOM,p)}catch(e){setErr(authMsg(e))}
  authBusy=false;busy(false);
}
async function doRegister(){
  if(authBusy||!X)return;
  const nombre=$('#aN').value.trim().replace(/\s+/g,' '),u=slug($('#aU').value),tel=$('#aT').value.trim(),p=$('#aP').value,p2=$('#aP2').value,tk=telKey(tel);
  if(nombre.length<3||!nombre.includes(' ')){setErr('Poné tu nombre y apellido');return}
  if(!/^[a-z0-9._-]{3,20}$/.test(u)){setErr('El usuario: de 3 a 20 letras o números, sin espacios ni tildes');return}
  if(u===ADMIN_USER){setErr('Ese usuario no está disponible');return}
  if(tk.length<8||String(tel).replace(/\D/g,'').length>15){setErr('Poné un teléfono válido, con característica (ej: 11 1234 5678)');return}
  if(p.length<6){setErr('La contraseña tiene que tener al menos 6 caracteres');return}
  if(p!==p2){setErr('Las contraseñas no coinciden');return}
  authBusy=true;REGISTERING=true;busy(true);setErr('');
  let cred=null;
  try{cred=await X.signUp(u+EMAIL_DOM,p)}catch(e){setErr(/email-already/.test((e&&e.code)||'')?'Ese usuario ya está en uso. Elegí otro':authMsg(e));REGISTERING=false;authBusy=false;busy(false);return}
  try{await X.batchSet([['users/'+cred.uid,{usuario:u,nombre,tel:tel,telKey:tk,creado:new Date().toISOString()}],['tels/'+tk,{uid:cred.uid}]])}
  catch(e){try{await X.deleteSelf()}catch(_){}try{await X.signOut()}catch(_){}REGISTERING=false;authBusy=false;busy(false);setErr('Ese teléfono ya está registrado en otra cuenta. Si ya tenés cuenta, ingresá con tu usuario.');return}
  REGISTERING=false;authBusy=false;
  await afterAuth(cred);
}

  CLIENTES.forEach(c=>m.set(c.id,{c,peds:[],otros:[]}));
  VENTAS_C.forEach(v=>{if(!m.has(v.uid))m.set(v.uid,{c:{id:v.uid,nombre:v.nombre||'(cliente eliminado)',usuario:v.usuario||'',tel:v.tel||'',_gone:true},peds:[],otros:[]});const g=m.get(v.uid);(v.tipo==='pedido'?g.peds:g.otros).push(v)});
  return [...m.values()].map(g=>({...g,nuevos:g.peds.filter(v=>v.estado==='nuevo')})).sort((a,b)=>(b.nuevos.length>0)-(a.nuevos.length>0)||String(a.c.nombre).localeCompare(String(b.c.nombre),'es'));
}
function vClientes(){
  const G=gruposClientes(),nNuevos=G.reduce((a,g)=>a+g.nuevos.length,0),nCli=G.filter(g=>g.nuevos.length).length;
  $('#main').innerHTML=`<div class="grid2"><div class="kpi"><small>Pedidos nuevos</small><div>${nNuevos}</div></div><div class="kpi"><small>Clientes con pedidos</small><div>${nCli}</div></div></div>
  <h3 style="margin:16px 2px 4px">Clientes (${CLIENTES.length})</h3><div style="margin:6px 0"><div class="sbox"><input id="qc" type="search" placeholder="Buscar por nombre, usuario o teléfono…" value="${esc(qCli)}" autocomplete="off"></div></div><div id="cliList"></div>`;
  $('#qc').oninput=e=>{qCli=e.target.value;pintarCli()};pintarCli();
}
function pedidoRow(v){
  const nuevo=v.estado==='nuevo';
  return `<div style="border-top:1px solid var(--line);padding:8px 0"><div class="row"><span style="flex:1"><b>${new Date(v.fecha).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</b> <span class="tag ${v.estado==='entregado'?'ok':''}">${esc(estTxt(v))}</span></span><b style="color:var(--yel)">${money(v.total)}</b></div>
  <div class="muted" style="margin:2px 0 6px">${v.items.map(i=>i.q+'× '+esc(i.n)+' <b>['+esc(i.c)+']</b>').slice(0,3).join(' · ')}${v.items.length>3?' · +'+(v.items.length-3)+' más':''}${v.nota?' — “'+esc(v.nota)+'”':''}</div>
  <div class="row" style="flex-wrap:wrap"><button class="btn sec sm" onclick="verCompra('${esc(v.id)}')">Ver</button>${nuevo?`<button class="btn sm" onclick="abrirEditor('${esc(v.id)}')">✎ Editar</button><button class="btn sec sm" onclick="setEstado('${esc(v.id)}','entregado')">Entregado</button><button class="btn bad sm" onclick="setEstado('${esc(v.id)}','cancelado')">Cancelar</button>`:''}<button class="btn bad sm" onclick="delPedido('${esc(v.id)}')">🗑 Eliminar</button></div></div>`;
}
function pintarCli(){
  const t=termsOf(qCli),G=gruposClientes().filter(g=>{const h=norm(g.c.nombre+' '+g.c.usuario+' '+g.c.tel);return t.every(x=>h.includes(x))});
  const defM=margenClienteBase()==null?S.cfg.margen:margenClienteBase();
  $('#cliList').innerHTML=G.length?G.map(g=>{
    const c=g.c,id=esc(c.id),abierto=OPENCLI.has(c.id)||(g.nuevos.length>0&&!OPENCLI.has('-'+c.id)),mine=[...g.peds,...g.otros].filter(v=>v.estado!=='cancelado'&&v.estado!=='anulada'),tot=mine.reduce((a,v)=>a+(v.total||0),0);
    const wa='https://wa.me/54'+(String(c.telKey||c.tel).replace(/\D/g,'').replace(/^(?!9)/,'9'));
    const head=`<div class="row" style="cursor:pointer" onclick="toggleCli('${id}')"><span style="font-size:18px;width:20px">${abierto?'▾':'▸'}</span><div style="flex:1;min-width:0"><b>${esc(c.nombre)}</b>${c.activo===false?' <span class="tag low">bloqueado</span>':''}<div class="muted">@${esc(c.usuario)} · ${esc(c.tel)}</div></div><div style="text-align:right">${g.nuevos.length?`<div class="tag" style="background:var(--yel);color:#1b1b1d;font-weight:800">🆕 ${g.nuevos.length} pedido${g.nuevos.length>1?'s':''}</div>`:''}<div class="muted" style="margin-top:2px">${mine.length} compra${mine.length===1?'':'s'} · ${money(tot)}</div></div></div>`;
    if(!abierto)return `<div class="card" ${g.nuevos.length?'style="border-color:var(--yel)"':''}>${head}</div>`;
    const peds=g.peds.length?`<div style="margin-top:10px"><b>Pedidos (${g.peds.length})</b>${g.peds.map(pedidoRow).join('')}</div>`:'<div class="muted" style="margin-top:10px">Sin pedidos.</div>';
    const otros=g.otros.length?`<div class="muted" style="margin-top:8px">Compras en el mostrador: ${g.otros.length}</div>`:'';
    const gest=c._gone?`<div class="row" style="margin-top:8px"><button class="btn bad sm" onclick="delGone('${id}')">Eliminar todo de este cliente</button></div>`:`<label>Precio especial: margen % (vacío = el de clientes, ${defM}%)</label><div class="row"><input style="flex:1;min-width:0" id="m_${id}" type="number" inputmode="decimal" value="${c.margen==null?'':c.margen}" placeholder="${defM}"><button class="btn sm" style="flex:none" onclick="saveCliMargen('${id}')">Guardar</button></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn sec sm" onclick="verComprasCli('${id}')">Compras</button><a style="text-decoration:none;display:inline-block;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em" target="_blank" rel="noopener" href="${wa}">WhatsApp</a><button class="btn sec sm" onclick="toggleCliAct('${id}')">${c.activo===false?'Desbloquear':'Bloquear'}</button><button class="btn bad sm" onclick="delCli('${id}')">Eliminar</button></div>`;
    return `<div class="card" ${g.nuevos.length?'style="border-color:var(--yel)"':''}>${head}${peds}${otros}${gest}</div>`}).join(''):'<div class="empty">No hay clientes.</div>';
}
function toggleCli(id){const nuevos=VENTAS_C.some(v=>v.uid===id&&v.tipo==='pedido'&&v.estado==='nuevo');const abierto=OPENCLI.has(id)||(nuevos&&!OPENCLI.has('-'+id));if(abierto){OPENCLI.delete(id);OPENCLI.add('-'+id)}else{OPENCLI.add(id);OPENCLI.delete('-'+id)}pintarCli()}
async function saveCliMargen(id){
  const el=$('#m_'+id),raw=el.value.trim(),v=raw===''?null:num(raw);
  if(v!==null&&(v<0||v>500)){toast('Margen entre 0 y 500');return}
  try{await X.update('users/'+id,{margen:v});toast(v===null?'Usa el margen de clientes':'Margen '+v+'% guardado')}catch(e){toast('No pude guardar')}
}
function toggleCliAct(id){const c=CLIENTES.find(x=>x.id===id);if(!c)return;const nuevo=c.activo===false;
  const go=async()=>{try{await X.update('users/'+id,{activo:nuevo});toast(nuevo?'Desbloqueado':'Bloqueado')}catch(e){toast('No pude guardar')}};
  nuevo?go():ask('¿Bloquear a '+c.nombre+'? No va a poder ver el catálogo.','Bloquear',go,true)}
function delCli(id){
  const c=CLIENTES.find(x=>x.id===id);if(!c)return;
  const vs=VENTAS_C.filter(v=>v.uid===id);
  ask('¿Eliminar a '+c.nombre+'?\n\nSe borran sus datos, su teléfono queda libre'+(vs.length?' y también sus '+vs.length+' pedido'+(vs.length>1?'s':'')+'/compras':'')+'. Para que pueda volver a registrarse con el mismo usuario, borralo también en Firebase → Authentication.','Eliminar cliente',async()=>{
    try{await X.batchDel(['users/'+id,'tels/'+(c.telKey||telKey(c.tel)),...vs.map(v=>'ventas/'+v.id)]);OPENCLI.delete(id);toast('Cliente eliminado')}catch(e){toast('No pude eliminar')}},true);
}
function delGone(id){const vs=VENTAS_C.filter(v=>v.uid===id);ask('¿Eliminar los '+vs.length+' pedido(s)/compra(s) de este cliente ya borrado?','Eliminar',async()=>{try{await X.batchDel(vs.map(v=>'ventas/'+v.id));toast('Eliminado')}catch(e){toast('No pude eliminar')}},true)}
function delPedido(id){
  const v=VENTAS_C.find(x=>x.id===id);if(!v)return;
  if(ROLE!=='admin'&&!(v.tipo==='pedido'&&(v.estado==='nuevo'||v.estado==='cancelado'))){toast('Este pedido ya no se puede eliminar');return}
  ask('¿Eliminar este pedido del '+new Date(v.fecha).toLocaleDateString('es-AR')+' ('+money(v.total)+')?\nNo se puede deshacer.','Eliminar',async()=>{
    try{await X.batchDel(['ventas/'+id]);closeModal();toast('Pedido eliminado')}catch(e){toast('No pude eliminar el pedido')}},true);
}
async function setEstado(id,e){try{await X.update('ventas/'+id,{estado:e});toast(e==='entregado'?'Marcado como entregado':'Pedido cancelado')}catch(er){toast('No pude guardar')}}
function verComprasCli(id){
  const c=CLIENTES.find(x=>x.id===id),L=VENTAS_C.filter(v=>v.uid===id);
  modal(`<h2>Compras de ${esc(c?c.nombre:'')}</h2>${L.length?L.map(v=>`<div class="card" onclick="verCompra('${esc(v.id)}')"><div class="row"><b style="flex:1">${new Date(v.fecha).toLocaleDateString('es-AR')}</b><span class="tag">${esc(estTxt(v))}</span><b style="color:var(--yel)">${money(v.total)}</b></div></div>`).join(''):'<div class="empty">Sin compras.</div>'}<div class="row" style="margin-top:10px"><button class="btn sec" style="flex:1" onclick="closeModal()">Cerrar</button></div>`);
}

/* ---------- catálogo actualizado solo desde elgasolero.com (lo baja un robot de GitHub cada día) ---------- */
async function cargarCatalogo(manual){
  if(!location.protocol.startsWith('http'))return;
  let cambio=false,hubo=false;
  try{
    const r=await fetch('catalogo.json',{cache:'no-cache'});
    if(r.ok){const j=await r.json();
      if(j&&Array.isArray(j.productos)&&j.productos.length>=1500){
        const nuevo=j.actualizado||'';
        if(!CATINFO||nuevo!==CATINFO.actualizado||manual){hubo=!CATINFO?!!(CAT||j.actualizado):nuevo!==CATINFO.actualizado;CAT=j.productos;Object.keys(j.fotos||{}).forEach(k=>EXTRA[k]=j.fotos[k]);CATINFO={actualizado:j.actualizado||null};cambio=true}
      }}
  }catch(e){}
  try{const r=await fetch('estado.json',{cache:'no-cache'});if(r.ok)CATEST=await r.json()}catch(e){}
  if(cambio)buildIndex();
  if(ROLE!=='init'&&!$('#modalHost').innerHTML&&(manual||(cambio&&!(ROLE==='admin'&&tab==='config'))))render();
  return hubo;
}
const fmtF=iso=>iso?new Date(iso).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):null;
function catalogoCard(){
  const e=CATEST,act=CATINFO&&CATINFO.actualizado;
  const dias=e&&e.verificado?Math.floor((Date.now()-new Date(e.verificado))/864e5):null;
  let estado;
  if(e&&e.ok===false)estado=`<div style="background:#4a1d1d;border:1px solid var(--bad);border-radius:8px;padding:10px;margin:8px 0"><b>⚠️ No se pudo actualizar</b><div class="muted" style="margin-top:4px">${esc(e.error||'')}</div><div class="muted" style="margin-top:4px">Se sigue usando el último catálogo bueno. Último intento: ${fmtF(e.fecha)||'—'}</div></div>`;
  else if(dias!==null&&dias>=3)estado=`<div style="background:#4a3b12;border:1px solid var(--yel);border-radius:8px;padding:10px;margin:8px 0"><b>⚠️ Hace ${dias} días que no se verifica</b><div class="muted">Revisá en GitHub que el robot siga corriendo.</div></div>`;
  else if(e&&e.ok)estado=`<p style="margin:6px 0">✅ Verificado con elgasolero.com: <b>${fmtF(e.verificado)}</b></p>`;
  else estado='<p class="muted" style="margin:6px 0">Todavía no hubo una actualización automática. Se usa el catálogo incluido en la app.</p>';
  return `<div class="card"><h3 style="margin:0 0 6px">📦 Catálogo de elgasolero.com</h3>${estado}<p class="muted" style="margin:0 0 10px">Precios de lista cambiados por última vez: ${act?'<b>'+fmtF(act)+'</b>':'catálogo incluido en la app'} · ${INDEX.filter(p=>!p.custom).length.toLocaleString('es-AR')} productos. El robot revisa la página todos los días y, si hay cambios, la app se actualiza sola con tu margen.</p><button class="btn sec sm" onclick="cargarCatalogo(true).then(c=>toast(c?'Catálogo actualizado':'Ya tenés lo último'))">Buscar actualización ahora</button></div>`;
}
buildIndex();render();fbBoot();cargarCatalogo();setInterval(()=>cargarCatalogo(),30*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)cargarCatalogo()});
/* ---------- app instalable (PWA) ---------- */
let deferredInstall=null;
const isHttp=location.protocol.startsWith('http');
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(tab==='config')render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('App instalada');if(tab==='config')render()});
function installApp(){if(!deferredInstall)return;deferredInstall.prompt();deferredInstall.userChoice.finally(()=>{deferredInstall=null;if(tab==='config')render()})}
function installCard(){
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let body;
  if(isStandalone())body='<p style="margin:0">✅ Ya la estás usando como app.</p>';
  else if(!isHttp)body='<p class="muted" style="margin:0">Para instalarla tiene que estar publicada en internet (GitHub Pages). Abierta desde un archivo no se puede.</p>';
  else if(deferredInstall)body='<button class="btn" style="width:100%" onclick="installApp()">Instalar app</button>';
  else if(ios)body='<p style="margin:0">En iPhone: tocá <b>Compartir</b> (el cuadrado con la flecha) y después <b>Agregar a inicio</b>.</p>';
  else body='<p class="muted" style="margin:0">En Chrome: menú ⋮ y después <b>Instalar app</b> (o <b>Agregar a la pantalla de inicio</b>).</p>';
  return `<div class="card"><h3 style="margin:0 0 6px">Instalar como app</h3><p class="muted" style="margin:0 0 10px">Queda en la pantalla de inicio, abre sin barra del navegador y anda sin internet. Las fotos sí necesitan conexión.</p>${body}</div>`;
}
if('serviceWorker' in navigator&&isHttp){
  const hadController=!!navigator.serviceWorker.controller;let recargado=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!recargado){recargado=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(e=>console.warn('sw',e)));
}
</script>
